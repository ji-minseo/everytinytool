name: Public HTTP SEO probe (read only)
on:
  pull_request:
    paths:
      - scripts/live_seo_probe.py
      - .github/workflows/live-seo-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public URLs without changing production
        run: python scripts/live_seo_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-http-seo-probe
          path: |
            live-seo-probe.json
            live-seo-probe.md
          retention-days: 7
